# .github/workflows/coveralls.yml

name: Code Coverage with Coveralls

# UPDATE HERE: Add your specific branch to the list
on:
  push:
    branches: 
      - "main"
      - "November-16-2025-ThematicTesting"
  pull_request:
    branches: 
      - "main"
      - "November-16-2025-ThematicTesting"

jobs:
  coverage:
    name: Test and Upload Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Ensure this script exists in your package.json and runs c8
      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: ./coverage/lcov.info