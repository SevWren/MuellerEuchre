# .github/workflows/coveralls.yml

name: Code Coverage with Coveralls

# Run this workflow on pushes and pull requests to the main branch
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  coverage:
    name: Test and Upload Coverage
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Node.js environment. Version should match your project's requirement.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x" # Using version 20.x based on your .nvmrc file
          cache: "npm"

      # 3. Install project dependencies using a clean install
      - name: Install dependencies
        run: npm ci

      # 4. Run the tests and generate the coverage report
      # This command comes directly from your package.json
      - name: Generate coverage report
        run: npm run test:coverage

      # 5. Upload the coverage report to Coveralls
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          # This token is automatically provided by GitHub Actions for API communication.
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Your private repository token, which you stored in GitHub Secrets.
          # This securely identifies your repository on Coveralls.io.
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}

          # Explicitly tell the action where to find the LCOV report generated by c8.
          file: ./coverage/lcov.info
