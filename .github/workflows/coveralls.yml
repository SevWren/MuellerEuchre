# .github/workflows/coveralls.yml

name: Code Coverage with Coveralls

# Run on pushes and PRs to specific branches
on:
  push:
    branches: 
      - "main"
      - "November-16-2025-ThematicTesting"
  pull_request:
    branches: 
      - "main"
      - "November-16-2025-ThematicTesting"

jobs:
  coverage:
    name: Test and Upload Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Pass the Coveralls token as an environment variable if needed
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          # This token is strictly for the Action to talk to GitHub API
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Path to the coverage file
          file: ./coverage/lcov.info